font_family      Iosevka Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11

symbol_map U+1F300-U+1FAFF,U+2600-U+27BF,U+2B00-U+2BFF,U+FE0F Noto Color Emoji

symbol_map U+4E00-U+9FFF,U+3040-U+30FF,U+AC00-U+D7AF,U+3400-U+4DBF,U+3000-U+303F Noto Sans CJK SC

symbol_map U+2200-U+22FF,U+27C0-U+27EF,U+2A00-U+2AFF,U+2300-U+23FF Noto Sans Symbols

symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD Symbols Nerd Font Mono

cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

enable_audio_bell no
draw_minimal_borders yes
inactive_text_alpha 0.7

include themes/belafonte_nigth.conf
background_opacity 0.9
background_blur 25

