$font = Iosevka Nerd Font Mono

$bg        = rgba(1a1b26ee)
$fg        = rgba(c0caf5ff)
$accent    = rgba(7aa2f7ff)
$accent2   = rgba(bb9af7ff)
$red       = rgba(f7768eff)
$green     = rgba(9eceaeff)
$border    = rgba(414868aa)
$placeholder = rgba(565f89ff)

general {
    hide_cursor = false
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.3
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $fg
    font_size = 92
    font_family = $font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d de %B")"
    color = $accent
    font_size = 20
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $fg
    font_size = 18
    font_family = $font
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 55
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = $border
    inner_color = $bg
    font_color = $fg
    fade_on_empty = false
    placeholder_text = <span foreground="##565f89">Password...</span>
    hide_input = false
    check_color = $green
    fail_color = $red
    fail_text = <span foreground="##f7768e">Incorrect</span>
    capslock_color = $accent2
    position = 0, -90
    halign = center
    valign = center
    font_family = $font
}

