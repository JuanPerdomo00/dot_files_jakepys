format = """
$os\
$username\
$hostname\
[ ](fg:#565f89)\
$directory\
[ ](fg:#565f89)\
$git_branch\
$git_commit\
$git_status\
$git_state\
$git_metrics\
$fill\
$nodejs\
$python\
$rust\
$golang\
$java\
$php\
$ruby\
$lua\
$c\
$docker_context\
$package\
$cmd_duration\
$line_break\
$character"""

palette = "tokyonight"

[palettes.tokyonight]
blue    = "#7aa2f7"
cyan    = "#7dcfff"
green   = "#9ece6a"
yellow  = "#e0af68"
red     = "#f7768e"
purple  = "#bb9af7"
orange  = "#ff9e64"
magenta = "#9d7cd8"
comment = "#565f89"
fg      = "#c0caf5"
dark    = "#24283b"

[fill]
symbol = " "

[os]
disabled = false
format   = "[$symbol]($style)"
style    = "bold blue"

[os.symbols]
Arch    = "󰣇 "
Artix   = "󰣇 "
Linux   = " "
Ubuntu  = " "
Debian  = " "
Fedora  = " "
NixOS   = " "

[username]
show_always = false
format      = "[$user]($style)"
style_user  = "bold green"
style_root  = "bold red"

[hostname]
ssh_only  = false
format    = "[@$hostname](bold yellow)"
disabled  = false

[directory]
format            = "[ $path]($style)[$read_only]($read_only_style) "
style             = "bold cyan"
read_only         = " 󰌾"
read_only_style   = "red"
truncation_length = 3
truncate_to_repo  = true
home_symbol       = "󰋜 ~"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = "󰝚 "
"Pictures"  = " "
"Videos"    = "󰈫 "
"Projects"  = "󰲋 "
"src"       = " "

[git_branch]
format            = "[ $symbol$branch(:$remote_branch)]($style) "
symbol            = " "
style             = "bold purple"
truncation_length = 25
truncation_symbol = "…"
always_show_remote = false

[git_commit]
format            = "[\\($hash$tag\\)]($style) "
style             = "bold yellow"
commit_hash_length = 7
tag_symbol        = " 󰓹 "
only_detached     = true
tag_disabled      = false

[git_status]
format     = "([$all_status$ahead_behind]($style))"
style      = "bold yellow"
ahead      = "[⇡${count}](bold green) "
behind     = "[⇣${count}](bold red) "
diverged   = "[⇕ ⇡${ahead_count} ⇣${behind_count}](bold orange) "
up_to_date = "[✓](bold green) "
untracked  = "[󰋗 ${count}](comment) "
stashed    = "[ ${count}](blue) "
modified   = "[ ${count}](yellow) "
staged     = "[󰐕 ${count}](green) "
renamed    = "[󰑕 ${count}](cyan) "
deleted    = "[ ${count}](red) "
conflicted = "[󰩼 ${count}](bold red) "

[git_state]
format        = "[ $state( $progress_current/$progress_total)]($style) "
style         = "bold red"
rebase        = "REBASE"
merge         = "󰘜 MERGE"
revert        = " REVERT"
cherry_pick   = " PICK"
bisect        = " BISECT"
am            = "AM"
am_or_rebase  = "AM/REBASE"

[git_metrics]
format            = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style       = "bold green"
deleted_style     = "bold red"
only_nonzero_diffs = true
disabled          = false

[nodejs]
format       = "[ $version]($style) "
symbol       = " "
style        = "bold green"
detect_files = ["package.json", ".nvmrc", ".node-version"]

[python]
format       = "[ ${pyenv_prefix}${version}( \\($virtualenv\\))]($style) "
symbol       = " "
style        = "bold yellow"
detect_files = ["requirements.txt", "pyproject.toml", "setup.py", ".python-version"]

[rust]
format       = "[ $version]($style) "
symbol       = " "
style        = "bold orange"
detect_files = ["Cargo.toml"]

[golang]
format       = "[ $version]($style) "
symbol       = " "
style        = "bold cyan"
detect_files = ["go.mod", "go.sum"]

[java]
format       = "[ $version]($style) "
symbol       = " "
style        = "bold red"
detect_files = ["pom.xml", "build.gradle", "*.java"]

[php]
format       = "[ $version]($style) "
symbol       = " "
style        = "bold magenta"
detect_files = ["composer.json", "*.php"]

[ruby]
format       = "[ $version]($style) "
symbol       = " "
style        = "bold red"
detect_files = ["Gemfile", ".ruby-version"]

[lua]
format       = "[ $version]($style) "
symbol       = " "
style        = "bold blue"
detect_files = ["*.lua", ".lua-version"]

[c]
format       = "[ $version]($style) "
symbol       = " "
style        = "bold blue"
detect_files = ["*.c", "*.h", "CMakeLists.txt"]

[docker_context]
format       = "[ $context]($style) "
symbol       = " "
style        = "bold blue"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

[package]
format          = "[󰏗 $version]($style) "
style           = "bold orange"
display_private = false

[cmd_duration]
format   = "[󱦟 $duration]($style) "
style    = "bold yellow"
min_time = 2_000

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold purple)"
