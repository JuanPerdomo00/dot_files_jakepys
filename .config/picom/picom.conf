# ================================
#         BACKEND / GENERAL
# ================================
backend = "xrender";
vsync = true;
use-damage = true;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
log-level = "warn";

unredir-if-possible = true;
unredir-if-possible-delay = 300;
unredir-if-possible-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# ================================
#            SHADOWS
# ================================
shadow = true;
shadow-radius = 12;
shadow-offset-x = -7;
shadow-offset-y = -7;

shadow-exclude = [
  "_GTK_FRAME_EXTENTS@",
  "_NET_WM_STATE *= '_NET_WM_STATE_HIDDEN'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'desktop'"
];

# ================================
#            FADING
# ================================
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

fade-exclude = [
  "class_g = 'slop'",
  "window_type = 'desktop'"
];

# ================================
#           OPACITY
# ================================
inactive-opacity = 0.90;
inactive-opacity-override = false;
active-opacity = 1.0;

focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'Bar'",
  "class_g = 'slop'",
  "class_g = 'ly'",
  "window_type = 'desktop'"
];

opacity-rule = [
  "100:class_g = 'mpv'",
  "100:class_g = 'slop'",
  "100:class_g = 'Polybar'"
];

# ================================
#           CORNERS
# ================================
corner-radius = 4;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# ================================
#         BLUR
# ================================
blur-kern = "3x3box";

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"
];

# ================================
#          WINDOW TYPES
# ================================
wintypes:
{
  tooltip       = { fade = true; shadow = true; opacity = 1.0; focus = true; full-shadow = false; };
  dock          = { shadow = false; clip-shadow-above = true; opacity = 1.0; };
  dnd           = { shadow = false; };
  popup_menu    = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
  desktop       = { shadow = false; opacity = 1.0; fade = false; };
};
